name: AprendeloIOS
options:
  bundleIdPrefix: com.aprendelo
targets:
  AprendeloIOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ios
      - path: index.html
        buildPhase: resources
      - path: static
        type: folder
        buildPhase: resources
    info:
      path: ios/Info.plist
      properties:
        UILaunchStoryboardName: LaunchScreen
